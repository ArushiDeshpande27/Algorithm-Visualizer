<!DOCTYPE html>
<html>
<head>
<title>CPU Scheduling Visualizer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<a class="back" href="main.html"></a>
<button onclick="logout()">Logout</button>

<script src="auth.js"></script>

<h1>CPU Scheduling Visualizer</h1>

<label>Select Algorithm</label>
<br>
<select id="algorithm" onchange="toggleQuantum()">
    <option value="fcfs">FCFS</option>
    <option value="rr">Round Robin</option>
</select>

<br><br>

<label>Enter Burst Times (comma separated)</label>
<br>
<input id="burst" placeholder="Example: 5,3,4">

<br><br>

<div id="quantumSection" style="display:none;">
<label>Time Quantum (for Round Robin)</label>
<br>
<input id="quantum" placeholder="Example: 2">
<br><br>
</div>

<button onclick="runScheduling()">Run</button>
<h2>Gantt Chart</h2>

<div id="gantt"></div>

<script src="os.js"></script>

</body>
</html>
